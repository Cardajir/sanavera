name: Deploy to Active24

# Manual for now: Vercel still deploys main on its own. Once the domain points
# at Active24, add `push: branches: [main]` under `on` and every merge goes
# live there too. See deploy/active24/README.md for the secrets this needs.
on:
  workflow_dispatch:

concurrency:
  group: deploy-active24
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:active24
        env:
          PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_TEMPLATE_ID: ${{ vars.PUBLIC_EMAILJS_TEMPLATE_ID }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.PUBLIC_EMAILJS_PUBLIC_KEY }}

      # lftp rather than an FTP action: Active24 offers SFTP on port 22 and the
      # common actions speak only FTP/FTPS. `mirror --reverse --delete` makes
      # the web root match dist/ exactly, which also clears the hosting's
      # placeholder page on the first run.
      - name: Upload dist/ over SFTP
        env:
          SFTP_HOST: ${{ secrets.ACTIVE24_FTP_HOST }}
          SFTP_USER: ${{ secrets.ACTIVE24_FTP_USER }}
          SFTP_PASSWORD: ${{ secrets.ACTIVE24_FTP_PASSWORD }}
          SFTP_PORT: ${{ vars.ACTIVE24_FTP_PORT || 22 }}
          SFTP_DIR: ${{ vars.ACTIVE24_FTP_DIR || '/www/' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Diagnostics first: a plain FTPS login says whether the credentials
          # are accepted at all (curl exit 67 = login denied), and a debug
          # listing over SFTP shows where that handshake stops.
          curl -sS --max-time 30 --ssl-reqd -u "$SFTP_USER:$SFTP_PASSWORD" "ftp://$SFTP_HOST/" -o /dev/null \
            && echo "FTPS login OK" || echo "FTPS login failed, curl exit $?"
          lftp -d -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" \
            -e "set sftp:auto-confirm yes; set net:max-retries 1; set net:timeout 30; ls; bye" 2>&1 \
            | grep -v -i "password" | tail -40 || true
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --delete --verbose --parallel=4 ./dist/ $SFTP_DIR;
            bye"
