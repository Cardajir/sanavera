name: Deploy to Active24

# Manual for now: Vercel still deploys main on its own. Once the domain points
# at Active24, add `push: branches: [main]` under `on` and every merge goes
# live there too. See deploy/active24/README.md for the secrets this needs.
on:
  workflow_dispatch:

concurrency:
  group: deploy-active24
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:active24
        env:
          PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_TEMPLATE_ID: ${{ vars.PUBLIC_EMAILJS_TEMPLATE_ID }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.PUBLIC_EMAILJS_PUBLIC_KEY }}

      # lftp over explicit FTPS. The hosting's SFTP (ProFTPD mod_sftp) drops
      # the connection right after the key exchange with a current OpenSSH
      # client, and its TLS certificate is issued to the shared FTP host, not
      # to the site's domain — so the upload goes to that host, where the
      # certificate verifies. `mirror --reverse --delete` makes the web root
      # match dist/ exactly, which also clears the hosting's placeholder page.
      - name: Upload dist/ over FTPS
        env:
          FTP_HOST: ${{ vars.ACTIVE24_FTPS_HOST || 'ftp.websupport.sk' }}
          FTP_USER: ${{ secrets.ACTIVE24_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.ACTIVE24_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.ACTIVE24_FTP_DIR || '/www/' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Login check first, so a refused password reads as "530" here rather
          # than as a mirror failure further down.
          curl -sS --max-time 30 --ssl-reqd -u "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_HOST/" -o /dev/null \
            && echo "FTPS login OK" || { echo "FTPS login failed, curl exit $?"; exit 1; }
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -e "
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --delete --verbose --parallel=4 ./dist/ $FTP_DIR;
            bye"
